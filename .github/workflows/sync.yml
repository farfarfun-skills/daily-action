name: Daily sync

on:
  schedule:
    - cron: "0 16 * * *" # 00:00 Asia/Shanghai (UTC+8)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ACTION_GITHUB_TOKEN }}
      ORG: ${{ github.repository_owner }}
    steps:
      - name: Sync forks with their upstream repositories
        shell: bash
        run: |
          set -euo pipefail

          forks="$RUNNER_TEMP/forks.tsv"
          gh api --paginate "orgs/$ORG/repos?type=forks&per_page=100" \
            --jq '.[] | [.name, .default_branch] | @tsv' > "$forks"

          failed=()
          while IFS=$'\t' read -r repo branch; do
            echo "Syncing $ORG/$repo ($branch)"
            gh api --method POST "repos/$ORG/$repo/merge-upstream" \
              -f branch="$branch" || failed+=("$repo")
          done < "$forks"

          ((${#failed[@]} == 0)) || {
            echo "::error::Failed to sync: ${failed[*]}"
            exit 1
          }

      - name: Mirror the Github organization repos to Gitee.
        if: always()
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/tauskills
          dst: gitee/tauskills
          dst_key: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          force_update: true
          account_type: org
